[package]
name = "player"
description = "PearTube's media player engine and its platform backends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxideav-core.workspace = true
oxideav-http.workspace = true
oxideav-ass = { workspace = true, features = ["render"] }
oxideav-subtitle = { workspace = true, features = ["text"] }
md5 = "0.7"
libc = "0.2"
thiserror = "2"
oxideav-pixfmt.workspace = true
parking_lot = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["media", "audio", "nativewindow", "api-level-29"] }

[dev-dependencies]
oxideav-mp4.workspace = true
oxideav-h264.workspace = true
parking_lot = "0.12"
codecs = { path = "../codecs" }
refcheck = { path = "../refcheck" }
