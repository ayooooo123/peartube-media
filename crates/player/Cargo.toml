[package]
name = "player"
description = "PearTube's media player engine and its platform backends"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
oxideav-core.workspace = true
oxideav-pixfmt.workspace = true
thiserror = "2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = "0.3"
objc2-av-foundation = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-core-audio-types = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = "0.3"

[dev-dependencies]
codecs = { path = "../codecs" }
