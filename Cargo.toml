[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.1"
edition = "2024"
# The H.264 and VP9 decoders (upstream OxideAV's, since 0.3.0) need 1.95.
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ayooooo123/peartube-media"
publish = false

# OxideAV crates resolve through the pinned git revisions in the
# [patch.crates-io] block below (scripts/pin-oxideav.py writes it).
[workspace.dependencies]
oxideav-core = "*"
oxideav-pixfmt = { version = "*", features = ["decode-only"] }
# Plain http only: the app reads every stream from its worklet's server on
# 127.0.0.1. https (rustls + ring, about 0.6 MB) is the fork's `tls`
# feature; the player's `https` feature turns it on.
oxideav-http = { version = "*", default-features = false }
# Containers
oxideav-avi = "*"
oxideav-basic = "*"
oxideav-dvd = "*"
oxideav-flv = "*"
oxideav-iff = "*"
oxideav-mkv = "*"
oxideav-mov = "*"
oxideav-mp4 = "*"
oxideav-mpegts = "*"
oxideav-ogg = "*"
# Video
oxideav-av1 = "*"
oxideav-cinepak = "*"
oxideav-dirac = "*"
oxideav-h261 = "*"
oxideav-h263 = "*"
oxideav-h264 = "*"
oxideav-h265 = "*"
oxideav-indeo = "*"
oxideav-mjpeg = "*"
oxideav-mpeg12video = "*"
oxideav-mpeg4video = "*"
oxideav-theora = "*"
oxideav-vc2 = "*"
oxideav-vp8 = "*"
oxideav-vp9 = "*"
# Audio
oxideav-aac = "*"
oxideav-ac3 = "*"
oxideav-adpcm = "*"
oxideav-flac = "*"
oxideav-g711 = "*"
oxideav-mp2 = "*"
oxideav-mp3 = "*"
oxideav-opus = "*"
oxideav-vorbis = "*"
oxideav-wma = "*"
# Subtitles
oxideav-ass = "*"
oxideav-sub-image = "*"
oxideav-subtitle = { version = "*", default-features = false }

refcheck = { path = "crates/refcheck" }
# libavformat/seek.c for the workspace's demuxers (DemuxSeek attempt 2).
demux-seek-core = { path = "crates/demux-seek-core" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
# Fat LTO runs at O3 for the 4 hot video decoders while every cold crate carries LLVM minsize (`"z"`).
[profile.release.package."*"]
opt-level = "z"
[profile.release.package.player]
opt-level = "z"
[profile.release.package.codecs]
opt-level = "z"
[profile.release.package.audio-trim]
opt-level = "z"
[profile.release.package.subs-bitmap]
opt-level = "z"
[profile.release.package.subs-cc]
opt-level = "z"
[profile.release.package.subs-render]
opt-level = "z"
[profile.release.package.subs-text]
opt-level = "z"
[profile.release.package.mpegaudiodsp]
opt-level = "z"
[profile.release.package.demux-asf]
opt-level = "z"
[profile.release.package.demux-misc]
opt-level = "z"
[profile.release.package.demux-mxf]
opt-level = "z"
[profile.release.package.demux-rm]
opt-level = "z"
[profile.release.package.demux-seek-core]
opt-level = "z"
[profile.release.package.codec-als]
opt-level = "z"
[profile.release.package.codec-ape]
opt-level = "z"
[profile.release.package.codec-apple-audio]
opt-level = "z"
[profile.release.package.codec-atrac]
opt-level = "z"
[profile.release.package.codec-dca]
opt-level = "z"
[profile.release.package.codec-dv]
opt-level = "z"
[profile.release.package.codec-gsm]
opt-level = "z"
[profile.release.package.codec-lpcm]
opt-level = "z"
[profile.release.package.codec-midi]
opt-level = "z"
[profile.release.package.codec-mlp]
opt-level = 3
[profile.release.package.codec-mp1]
opt-level = "z"
[profile.release.package.codec-mp2]
opt-level = "z"
[profile.release.package.codec-musepack]
opt-level = "z"
[profile.release.package.codec-ra]
opt-level = "z"
[profile.release.package.codec-rv]
opt-level = "z"
[profile.release.package.codec-shorten]
opt-level = "z"
[profile.release.package.codec-speech]
opt-level = "z"
[profile.release.package.codec-speex]
opt-level = "z"
[profile.release.package.codec-svq1]
opt-level = "z"
[profile.release.package.codec-svq3]
opt-level = "z"
[profile.release.package.codec-tak]
opt-level = "z"
[profile.release.package.codec-tracker]
opt-level = "z"
[profile.release.package.codec-tta]
opt-level = "z"
[profile.release.package.codec-vp3]
opt-level = "z"
[profile.release.package.codec-vp56]
opt-level = "z"
[profile.release.package.codec-wavpack]
opt-level = "z"
[profile.release.package.codec-wma]
opt-level = "z"
[profile.release.package.codec-wmv]
opt-level = "z"
[profile.release.package.refcheck]
opt-level = "z"
[profile.release.package.oxideav-core]
opt-level = 2
[profile.release.package.oxideav-pixfmt]
opt-level = "s"
[profile.release.package.oxideav-h264]
opt-level = 3
[profile.release.package.oxideav-h265]
opt-level = 3
[profile.release.package.oxideav-av1]
opt-level = 3
[profile.release.package.oxideav-vp9]
opt-level = 3
[profile.release.package.oxideav-mpeg12video]
opt-level = 3
[profile.release.package.oxideav-mpeg4video]
opt-level = 3
[profile.release.package.oxideav-mkv]
opt-level = "s"
[profile.release.package.oxideav-mp4]
opt-level = "s"
[profile.release.package.perf]
opt-level = 3
# Tests decode real samples; unoptimized codecs make them crawl.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

