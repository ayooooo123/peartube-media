[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ayooooo123/peartube-media"
publish = false

# OxideAV crates resolve through the pinned git revisions in the
# [patch.crates-io] block below (scripts/pin-oxideav.py writes it).
[workspace.dependencies]
oxideav-core = "*"
oxideav-pixfmt = "*"
oxideav-http = "*"
# Containers
oxideav-avi = "*"
oxideav-basic = "*"
oxideav-dvd = "*"
oxideav-flv = "*"
oxideav-iff = "*"
oxideav-mkv = "*"
oxideav-mov = "*"
oxideav-mp4 = "*"
oxideav-mpegts = "*"
oxideav-ogg = "*"
# Video
oxideav-av1 = "*"
oxideav-cinepak = "*"
oxideav-dirac = "*"
oxideav-h261 = "*"
oxideav-h263 = "*"
oxideav-h264 = "*"
oxideav-h265 = "*"
oxideav-indeo = "*"
oxideav-mjpeg = "*"
oxideav-mpeg12video = "*"
oxideav-mpeg4video = "*"
oxideav-msmpeg4 = "*"
oxideav-svq = "*"
oxideav-theora = "*"
oxideav-vc2 = "*"
oxideav-vp6 = "*"
oxideav-vp8 = "*"
oxideav-vp9 = "*"
# Audio
oxideav-aac = "*"
oxideav-ac3 = "*"
oxideav-adpcm = "*"
oxideav-ape = "*"
oxideav-cook = "*"
oxideav-dts = "*"
oxideav-flac = "*"
oxideav-g711 = "*"
oxideav-midi = "*"
oxideav-mod = "*"
oxideav-mp1 = "*"
oxideav-mp2 = "*"
oxideav-mp3 = "*"
oxideav-musepack = "*"
oxideav-opus = "*"
oxideav-s3m = "*"
oxideav-speex = "*"
oxideav-tta = "*"
oxideav-vorbis = "*"
oxideav-wavpack = "*"
oxideav-wma = "*"
# Subtitles
oxideav-ass = "*"
oxideav-sub-image = "*"
oxideav-subtitle = "*"

refcheck = { path = "crates/refcheck" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Tests decode real samples; unoptimized codecs make them crawl.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

