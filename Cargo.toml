[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ayooooo123/peartube-media"
publish = false

# OxideAV crates resolve through the pinned git revisions in the
# [patch.crates-io] block below (scripts/pin-oxideav.py writes it).
[workspace.dependencies]
oxideav-core = "*"
oxideav-pixfmt = "*"
# Plain http only: the app reads every stream from its worklet's server on
# 127.0.0.1. https (rustls + ring, about 0.6 MB) is the fork's `tls`
# feature; the player's `https` feature turns it on.
oxideav-http = { version = "*", default-features = false }
# Containers
oxideav-avi = "*"
oxideav-basic = "*"
oxideav-dvd = "*"
oxideav-flv = "*"
oxideav-iff = "*"
oxideav-mkv = "*"
oxideav-mov = "*"
oxideav-mp4 = "*"
oxideav-mpegts = "*"
oxideav-ogg = "*"
# Video
oxideav-av1 = "*"
oxideav-cinepak = "*"
oxideav-dirac = "*"
oxideav-h261 = "*"
oxideav-h263 = "*"
oxideav-h264 = "*"
oxideav-h265 = "*"
oxideav-indeo = "*"
oxideav-mjpeg = "*"
oxideav-mpeg12video = "*"
oxideav-mpeg4video = "*"
oxideav-msmpeg4 = "*"
oxideav-svq = "*"
oxideav-theora = "*"
oxideav-vc2 = "*"
oxideav-vp6 = "*"
oxideav-vp8 = "*"
oxideav-vp9 = "*"
# Audio
oxideav-aac = "*"
oxideav-ac3 = "*"
oxideav-adpcm = "*"
oxideav-cook = "*"
oxideav-dts = "*"
oxideav-flac = "*"
oxideav-g711 = "*"
oxideav-midi = "*"
oxideav-mod = "*"
oxideav-mp2 = "*"
oxideav-mp3 = "*"
oxideav-opus = "*"
oxideav-s3m = "*"
oxideav-speex = "*"
oxideav-vorbis = "*"
oxideav-wma = "*"
# Subtitles
oxideav-ass = "*"
oxideav-sub-image = "*"
oxideav-subtitle = "*"

refcheck = { path = "crates/refcheck" }
# libavformat/seek.c for the workspace's demuxers (DemuxSeek attempt 2).
demux-seek-core = { path = "crates/demux-seek-core" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Size, as the app's mobile/Cargo.toml builds libmain.so (keep the two in
# step). Dependencies and this workspace's cold crates build for size; the
# code that must keep its speed builds at 3: the decoders that play HD video
# or sit near PerfAudit's real-time floors, oxideav-core's bit readers,
# oxideav-pixfmt's RGBA conversion and the engine. Binaries stay at 3: fat LTO
# optimises the whole program at the final crate's level, and at "s" rustc
# turns off loop and SLP vectorization for all of it. Workspace crates default
# to 3 here but are "s" in the app unless listed there: put a new crate in one
# of the two lists.
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.oxideav-core]
opt-level = 3
[profile.release.package.oxideav-pixfmt]
opt-level = 3
[profile.release.package.oxideav-h264]
opt-level = 3
[profile.release.package.oxideav-h265]
opt-level = 3
[profile.release.package.oxideav-av1]
opt-level = 3
[profile.release.package.oxideav-vp8]
opt-level = 3
[profile.release.package.oxideav-vp9]
opt-level = 3
[profile.release.package.oxideav-mpeg12video]
opt-level = 3
[profile.release.package.oxideav-mpeg4video]
opt-level = 3
[profile.release.package.oxideav-aac]
opt-level = 3
[profile.release.package.oxideav-mp3]
opt-level = 3
# The Opus and AC-3 ports stay "s" (PerfAudit 2026-10-08): Opus 7.1 decodes
# at 55x real time there under load (80x at 3, 44% fewer instructions),
# E-AC-3 7.1 at 138x (163x at 3), far above the 10x audio floor.
# The Ogg demuxer runs per packet: at "s" it costs Opus in Ogg about 0.4%
# more instructions (16 KB). The Matroska demuxer at 3 changed nothing.
[profile.release.package.oxideav-ogg]
opt-level = 3
# Hot workspace crates (player, codec-wmv, codec-dca, codec-dv) keep the
# default 3. DV at "s" decodes DVCPRO HD 1080 at 2.2x real time under load,
# at the 2x floor for HD; 3 takes 28% fewer instructions.
[profile.release.package.audio-trim]
opt-level = "s"
[profile.release.package.codec-als]
opt-level = "s"
[profile.release.package.codec-ape]
opt-level = "s"
[profile.release.package.codec-lpcm]
opt-level = "s"
[profile.release.package.codec-gsm]
opt-level = "s"
[profile.release.package.codec-mlp]
opt-level = "s"
[profile.release.package.codec-mp1]
opt-level = "s"
[profile.release.package.codec-musepack]
opt-level = "s"
[profile.release.package.codec-ra]
opt-level = "s"
[profile.release.package.codec-rv]
opt-level = "s"
[profile.release.package.codec-shorten]
opt-level = "s"
[profile.release.package.codec-tak]
opt-level = "s"
[profile.release.package.codec-tta]
opt-level = "s"
[profile.release.package.codec-wavpack]
opt-level = "s"
[profile.release.package.codec-wma]
opt-level = "s"
[profile.release.package.codecs]
opt-level = "s"
[profile.release.package.demux-asf]
opt-level = "s"
[profile.release.package.demux-misc]
opt-level = "s"
[profile.release.package.demux-rm]
opt-level = "s"
[profile.release.package.demux-seek-core]
opt-level = "s"
[profile.release.package.mpegaudiodsp]
opt-level = "s"
[profile.release.package.subs-bitmap]
opt-level = "s"
[profile.release.package.subs-cc]
opt-level = "s"
[profile.release.package.subs-text]
opt-level = "s"
[profile.release.package.codec-apple-audio]
opt-level = "s"
[profile.release.package.codec-atrac]
opt-level = "s"
[profile.release.package.codec-speech]
opt-level = "s"
[profile.release.package.codec-speex]
opt-level = "s"
[profile.release.package.codec-vp3]
opt-level = "s"
[profile.release.package.codec-vp56]
opt-level = "s"
[profile.release.package.demux-mxf]
opt-level = "s"

# Tests decode real samples; unoptimized codecs make them crawl.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3

