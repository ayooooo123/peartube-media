# MPEG-VOB/interlaced/twc-teme-svcd-sample.mpg) and VLC's SVCD/karaoke.bin
# carry no private stream 1 at all; FFmpeg and mkvmerge cannot write OGT.
# This entry documents the gap; the runner reports the row as missing.
[[entry]]
path = "gen:sub_svcd_placeholder.bin"
rows = ["sub:svcd"]
compare = ["sub:decodes"]

# CMML and Kate: FFmpeg cannot read either, so these decode without an
# oracle; the Player tests check their cues against the Xiph mappings.
# The CMML file is built by generate.sh to the Xiph CMML mapping; the Kate
# sample is libkate's.
[[entry]]
path = "gen:sub_cmml.ogg"
rows = ["sub:cmml"]
compare = ["sub:decodes"]

[[entry]]
path = "fate:ogg-kate/kate-subtitles.ogg"
rows = ["sub:kate"]
compare = ["sub:decodes"]

