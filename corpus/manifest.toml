# corpus/manifest.toml
# One entry per corpus sample. `path` is `fate:<relative-under-FATE_SUITE>` or
# `gen:<name>` (files made by corpus/generate.sh into PEARTUBE_CORPUS_DIR,
# default ~/projects/peartube-media-corpus).
# rows    = yardstick rows covered (ids from corpus/yardstick.toml)
# compare = per-stream comparison: md5 (bit-exact vs FFmpeg), snr:<dB> (audio
#           SNR floor), decodes (must end Ended; FFmpeg itself cannot compare,
#           e.g. synthetic or format-not-in-FFmpeg cases are NOT this: decodes
#           is for formats whose FFmpeg reference the runner cannot produce).
# stream selection: `streams` lists the stream indices to play per kind when
# non-default; absent = the player's defaults (first of each kind).

