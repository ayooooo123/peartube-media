# corpus/manifest.toml
# One entry per corpus sample. `path` is `fate:<relative-under-FATE_SUITE>`,
# `gen:<name>` (files made by corpus/generate.sh into PEARTUBE_CORPUS_DIR,
# default ~/projects/peartube-media-corpus), or `samples:<archive path>` (a
# file of FFmpeg's sample archive, https://samples.ffmpeg.org/, which
# corpus/fetch-samples.sh fetches into FFMPEG_SAMPLES, default
# ~/projects/oracles/ffmpeg-samples; corpus/samples.sha256 pins each one,
# and the runner refuses a file that differs).
# rows    = yardstick rows covered (ids from corpus/yardstick.toml)
# compare = one policy per stream kind the sample has (a played stream with
#           no policy fails):
#   video:md5        every frame's MD5 equals FFmpeg's, same frame count
#   audio:md5        PCM byte-identical to FFmpeg's in the decoder's sample
#                    format, same sample count (integer/lossless decoders)
#   audio:snr:<dB>   SNR >= floor, lengths within one decoder frame (float
#                    decoders; the contract's floor is 90 dB, lower is refused)
#   sub:text         every cue's timing (ms) and body equal FFmpeg's decode
#                    re-encoded as SubRip, same count, every cue shown
#   sub:bitmap       as many bitmaps as FFmpeg's decoder emits, same start
#                    (and end) times, same canvas states as FFmpeg's sub2video
#   <kind>:decodes   plays to the end with output; only for formats FFmpeg
#                    cannot decode (the runner fails it when FFmpeg can), and
#                    never a verified pass
#   diag:audio:snr:<dB>  SNR against a floor, reported, never accepting (keeps
#                    the measurement of formats below the contract floor)
#           Under video:md5 and audio:*, a stream that plays but outputs
#           nothing passes only when FFmpeg's demuxer reads no packet of it
#           either (a PMT can declare streams that never carry one).
#           Records of one sample and stream selection merge; two different
#           policies for one kind are an error.
# stream selection: `streams` lists the stream indices to play per kind when
# non-default; absent = the player's defaults (first of each kind). Records
# with different selections of one sample are separate entries.

